name: Catalog health

# Weekly check that every catalog download still resolves AND still serves a file.
# Vendors rename, re-version and change format without warning (Endgame Gear swapped
# .exe -> .zip mid-version and silently broke that entry), so this catches rot before
# someone hits it on a fresh wipe.
#
# It runs the full_catalog_sweep test, which walks every entry x platform through the
# REAL resolver code and fetches each resolved URL with the downloader's own client
# config — so a pass means the app can actually download it, not just that a URL 200s.
on:
  schedule:
    # Mondays, 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  # write, not read: the sweep publishes health.json back to master, which the shipped app
  # fetches at launch to badge each download. The catalog itself is compiled into the
  # binary, so this file is the only way a link that rots mid-release ever gets flagged.
  contents: write
  issues: write

concurrency:
  group: catalog-health
  cancel-in-progress: false

jobs:
  sweep:
    # Windows matches the Release runner, and mirrors ci.yml's rust job setup.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      # tauri-build wants the frontend dist present before the crate will build.
      - run: npm ci
      - run: npm run build

      # Never fail the step itself — a red X here would just be noise. The parse step
      # below decides whether anything is actually wrong.
      - name: Sweep every catalog download
        id: sweep
        shell: bash
        working-directory: src-tauri
        continue-on-error: true
        env:
          # Without this the ~30 github_release entries exhaust the anonymous 60/hour API
          # cap mid-sweep and every one of them reports a bogus 403. Lifts it to 5000/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cargo test --lib -- --ignored --nocapture full_catalog_sweep > sweep.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      # The app deletes any download signed by someone other than the catalog's pinned signer
      # (src-tauri/src/verify.rs). A vendor that renews its certificate under a new name would
      # break that app for everyone, so compare the live signers every week too.
      - name: Check installer signers
        shell: bash
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          (cd src-tauri && cargo test --lib -- --ignored --nocapture dump_signable_windows_urls > /dev/null 2>&1)
          node scripts/collect-signers.mjs --check > signers.log 2>&1
          true

      - name: Summarise
        id: report
        shell: bash
        run: |
          LOG=src-tauri/sweep.log
          # Individual failure lines can still be long (a vendor page snippet), so cap them.
          grep -a '^BROKEN' "$LOG" | cut -c1-300 > broken.txt || true
          grep -a '^UNCOVERED' "$LOG" | cut -c1-300 > uncovered.txt || true
          grep -a '^SIGNER CHANGED' signers.log 2>/dev/null | cut -c1-300 >> broken.txt || true
          # The sweep writes this next to the crate; it belongs at the repo root, where the
          # app's raw.githubusercontent URL points.
          mv src-tauri/health.json health.json 2>/dev/null || true
          SUMMARY=$(grep -a 'catalog sweep:' "$LOG" | head -1)
          COUNT=$(wc -l < broken.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY:-sweep produced no summary line}" >> "$GITHUB_OUTPUT"

          {
            echo "## Catalog health"
            echo ""
            echo "\`${SUMMARY:-no summary}\`"
            echo ""
            if [ "$COUNT" -gt 0 ]; then
              echo "### Broken ($COUNT)"
              echo '```'
              cat broken.txt
              echo '```'
            else
              echo "All catalog downloads resolved and served a file. :white_check_mark:"
            fi
            if [ -s uncovered.txt ]; then
              echo ""
              echo "### Couldn't verify ($(wc -l < uncovered.txt | tr -d ' '))"
              echo '```'
              cat uncovered.txt
              echo '```'
              echo "> **These are not failures.** A GitHub runner's IP gets bot-blocked and rate-limited by vendors that answer a home connection fine — the first run of this workflow called 6 entries broken and 3 of them (Tarkov, Prime95, PuTTY) worked perfectly minutes later. Webview resolvers also land here, since they need a real desktop session. Check these by hand, or from the app's own Settings ▸ Check All Downloads, before changing anything."
            fi
            echo ""
            echo "<sub>[run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · sweeps every entry through the real resolver + downloader client</sub>"
          } > body.md

          cat body.md >> "$GITHUB_STEP_SUMMARY"

      # The shipped app reads this at launch to badge each download green/amber/red. It's
      # committed rather than uploaded as an artifact so raw.githubusercontent.com can serve
      # it to the app with no token, no API quota and no release.
      - name: Publish health.json
        if: hashFiles('health.json') != ''
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health.json
          if git diff --cached --quiet; then
            echo "health unchanged since last run"
          else
            git commit -m "chore: publish catalog health [skip ci]"
            # Another job may have landed on master while the sweep was running.
            git pull --rebase --autostash origin master
            git push origin HEAD:master
          fi

      # One long-lived issue that gets reopened/updated rather than a new one each week,
      # so this can't spam the tracker. Closed automatically once everything passes again.
      - name: Open / update / close the tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.report.outputs.count }}
        run: |
          TITLE="Catalog health: broken downloads"
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$TITLE in:title" --json number,title \
                 --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)

          if [ "$COUNT" -gt 0 ]; then
            if [ -n "$NUM" ]; then
              gh issue reopen --repo "$GITHUB_REPOSITORY" "$NUM" 2>/dev/null || true
              gh issue comment --repo "$GITHUB_REPOSITORY" "$NUM" --body-file body.md
              echo "updated issue #$NUM"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
              echo "opened a new issue"
            fi
            exit 1   # surface the run as failed so the scheduled-workflow email fires
          else
            if [ -n "$NUM" ]; then
              STATE=$(gh issue view --repo "$GITHUB_REPOSITORY" "$NUM" --json state --jq .state)
              if [ "$STATE" = "OPEN" ]; then
                gh issue comment --repo "$GITHUB_REPOSITORY" "$NUM" --body-file body.md
                gh issue close --repo "$GITHUB_REPOSITORY" "$NUM"
                echo "everything passes again — closed issue #$NUM"
              fi
            fi
            echo "all good"
          fi
